      Promoted, but NOT as a separate dataset — GCF sits in the Awards/Projects layer (multilateral, intermediated), so the Chile content is a `countries = Chile` filter inside the existing `gcf/gcf-projects` review (GCF Projects API). That review now carries the Chile slice (7 FPs + readiness), the access structure (NDA = Min. Hacienda, AE = FYNSA), the mitigation-scope flags (FP254 adaptation out of scope), and the FP→action crosswalk (FP189 e-mobility → zero-emission buses is the city-facing one). Not ODA/DAC-gated, so Chile is eligible. See gcf-projects README + knowledge-base "Funder levels".
