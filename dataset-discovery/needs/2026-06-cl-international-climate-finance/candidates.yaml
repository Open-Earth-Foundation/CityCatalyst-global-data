  publisher: Adaptation Fund
  url: https://www.adaptation-fund.org/imp_entity/agencia-de-cooperacion-internacional-de-chile-agcicl/
  also: [https://www.adaptation-fund.org/adaptation-fund-project-story-water-management-and-agriculture-in-chile/]
  themes: [adaptation, water, agriculture, resilience, multilateral]
  coverage: AGCID is the accredited National Implementing Entity. First project US$9.96M (approved 2015) — drought/water/agriculture resilience for smallholders in O'Higgins. Verified-2026-06-18.
