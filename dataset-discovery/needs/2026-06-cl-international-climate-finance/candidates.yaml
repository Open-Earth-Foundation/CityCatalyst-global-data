    verdict: deprioritize   # OUT OF SCOPE — adaptation-only (we don't cover adaptation actions)
    notes: >
      OUT OF SCOPE (2026-06-18): the Adaptation Fund is, by definition, adaptation-only, and we do not cover adaptation actions — so it cannot map to the (mitigation) action list. Recorded for memory: AGCID is the National Implementing Entity; Chile's two AF projects are O'Higgins smallholder drought/water resilience (US$9.96M, 2015) and the Quilpué/Valparaíso water-security innovation grant (US$230k). Both are water/drought adaptation. No review opened. Reopen only if adaptation actions come into scope.
  added: 2026-06-18

