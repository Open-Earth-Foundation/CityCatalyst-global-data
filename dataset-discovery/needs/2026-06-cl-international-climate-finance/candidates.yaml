# Candidates for need 2026-06-cl-international-climate-finance (run 2026-06-18).
# Verdicts: promote | investigate | deprioritize | reject (see dataset-discovery/references/screening-criteria.md).
# Seeded from the 112 international rows in cl-ssg/cl-ssg-finance (the 2023 SSG snapshot) and verified
# against funder pages where feasible (verified-2026-06-18 noted per entry). Broad-capture, tier-tagged:
# access pathway is an attribute, not a kill-criterion. Grouped by city/community DIRECTNESS.

candidates:

# =====================================================================
# TIER 1 — community / city-DIRECT windows (highest direct relevance)
# =====================================================================

- id: gef-sgp-chile
  name: GEF Small Grants Programme (UNDP-implemented) / Programa de Pequeñas Donaciones (PPD)
  publisher: Global Environment Facility / UNDP
  url: https://sgp.undp.org/
  also: [https://www.thegef.org/what-we-do/topics/gef-small-grants-program, https://www.thegef.org/projects-operations/country-profiles/chile]
  themes: [community, grants, biodiversity, climate, multilateral]
  coverage: 'community-direct grants ≤US$75,000 (typically US$25-50k) to CBOs/NGOs (focus Indigenous peoples, women, youth) for local environmental action; focal areas biodiversity / climate / land degradation. Chile re-included in GEF-8 (programme expanded 124→135 countries).'
  access: 'apply any time via the SGP National Coordinator (concept → proposal, National Steering Committee). 100% co-financing required (50% in-kind / 50% cash). NOT DAC-gated (GEF recipient eligibility, not ODA-list) — so unlike the city facilities, Chile is eligible. Verified-2026-06-18.'
  license: public programme info (sgp.undp.org)
  chile_route: UNDP SGP National Coordinator (to be named when Chile programme is live); GEF Operational Focal Point = Miguel Stutzin (MMA)
  screening:
    verdict: investigate   # promote-ready; open a review only once a Chile programme/call is operational
    notes: >
      STRONGEST international candidate (the one truly community-direct window, and NOT ODA/DAC-gated so Chile is eligible) — but NOT YET OPERATIONAL: Chile is a GEF-8 REACTIVATION (programme previously closed), and as of 2026-06-18 no Chile National Coordinator or open convocatoria was found (active PPD calls are CR/Peru/Argentina/Honduras/Mexico). Kept in discovery rather than as a dead review folder (a started review was opened then removed, to avoid an empty entry). Trap to remember: the GEF Chile country page's GEF-8 STAR allocation (~US$25.6M) is the NATIONAL envelope, NOT the SGP small-grants budget — don't conflate. PROMOTE TO A REVIEW once a Chile SGP programme/call exists; then it maps to actions at the focal-area grain like the FPA awards.
  added: 2026-06-18

- id: city-gap-fund
  name: City Climate Finance Gap Fund
  publisher: World Bank + European Investment Bank (EIB)
  url: https://www.citygapfund.org/
  also: [https://www.worldbank.org/en/programs/gap-fund/overview, https://www.eib.org/en/products/blending/donor-partnerships/trust-funds/city-climate-finance-gap-fund]
  themes: [cities, technical_assistance, project_preparation, adaptation, mitigation]
  coverage: developing-world cities; €100M, TA + project-preparation ONLY (not direct investment finance). 95 cities / 36 countries by Sep 2022, incl. LAC (Colombia, Argentina, Brazil, Mexico, Ecuador, Panama). Verified-2026-06-18.
  access: city applies for technical assistance via WB or EIB delivery; helps make projects finance-ready. Chile-city eligibility NOT confirmed in the 2022 list — verify.
  license: public programme info (citygapfund.org)
  url: https://www.citygapfund.org/
  also: [https://www.citygapfund.org/frequently-asked-questions/, https://www.citygapfund.org/eligibility-criteria/]
  screening:
    verdict: deprioritize   # NOT APPLICABLE to Chile — finding kept here, no review folder (verified 2026-06-18)
    notes: >
      NOT APPLICABLE to Chile (eligibility gate). The Gap Fund (World Bank + EIB + GIZ; €105M; rolling EoI; in-kind TA up to pre-feasibility, no investment finance; urban climate sectors incl. NbS, mobility, EE, waste/water) only supports cities of OECD-DAC ODA-RECIPIENT countries. Chile GRADUATED from the DAC list (high-income/OECD member, effective 2018 flows), so Chilean cities are ineligible for new support despite the otherwise-ideal city-direct fit. A Municipality of Independencia concept surfaced in search but is unverified (likely pre-graduation or a peer/knowledge activity). No dataset-review opened (would be a dead entry); the full finding lives here. Reopen only if a current Chilean engagement is confirmed. The same DAC/high-income gate excludes Chile from C40 CFF and most ODA-funded city facilities — see the cross-cutting finding in need.md.
  added: 2026-06-18

- id: c40-cff
  name: C40 Cities Finance Facility (CFF)
  publisher: C40 Cities Climate Leadership Group + GIZ
  url: https://www.c40cff.org/
  themes: [cities, technical_assistance, project_preparation, transport, energy, waste]
  coverage: C40-network and partner cities; TA to develop bankable climate-infrastructure projects. Santiago is a C40 member.
  access: 'city / city-network access; TA, not direct finance. Cycle/eligibility for Chilean cities to verify. SSG: "C40 Cities Climate Leadership Group + GIZ - C40 Cities Finance Facility (CFF)".'
  license: public programme info
  screening:
    verdict: deprioritize
    notes: >
      Verified 2026-06-18: CFF has supported 30 cities / 38 projects; LAC = Bogotá, Buenos Aires, Mexico City, Curitiba — NO Chile/Santiago project found. Santiago is a C40 *member* but not a CFF project city. CFF also targets developing-country cities, so the same DAC/high-income gate that excludes Chile from the Gap Fund likely applies. Deprioritized for Chile (no engagement + likely ineligible); no review folder opened to avoid a hollow entry. Reopen if a Chilean CFF project appears.
  added: 2026-06-18

- id: bloomberg-mayors-challenge
  name: Bloomberg Philanthropies — Global Mayors Challenge
  publisher: Bloomberg Philanthropies
  url: https://www.bloomberg.org/government-innovation/spurring-innovation-in-cities/mayors-challenge/
  themes: [cities, innovation, grants, philanthropy]
  coverage: global city competition; grants + technical support for municipal innovation (climate among themes).
  access: 'city/municipality applies in competition rounds (periodic, not annual). SSG: "Bloomberg Philanthropies Global Mayors Challenge".'
  license: public programme info
  screening:
    verdict: investigate
    notes: >
      Rare philanthropy line that is genuinely city-APPLICANT (not via a national entity). Competition cadence is irregular — record as periodic. Climate is one theme among several, so tag specificity=broad. Kept for the city-direct value.
  added: 2026-06-18

- id: subnational-climate-fund
  name: Subnational Climate Fund (SCF)
  publisher: Pegasus Capital Advisors (GCF FP151/FP152 anchor)
  url: https://www.subnational.fund/
  themes: [subnational, blended_finance, mitigation, adaptation]
  coverage: global; blended finance + TA for mid-sized subnational climate-infrastructure projects, anchored by a GCF commitment.
  access: 'investment vehicle (equity/blended), not a grant a city applies to; intermediated via the fund manager. SSG: "Pegasus Capital Advisors - Subnational Climate Fund (SCF)".'
  license: public programme info
  screening:
    verdict: investigate
    notes: >
      Subnational in name and GCF-anchored, but a commercial blended-finance vehicle — access is via the fund manager / project sponsors, not a city application. Tag access_pathway=intermediated, instrument=blended/equity. Lower direct relevance than the TA facilities; kept to record the GCF-subnational link.
  added: 2026-06-18

