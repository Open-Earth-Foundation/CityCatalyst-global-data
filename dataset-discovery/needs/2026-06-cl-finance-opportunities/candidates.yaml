# Search output for need 2026-06-cl-finance-opportunities (run 2026-06-08).
# Verdicts: promote | investigate | deprioritize | reject (see skill
# references/screening-criteria.md). Rejected entries are kept — they are
# institutional memory of dead ends.
#
# BROAD-CAPTURE strategy (Amanda, 2026-06-08): the dataset casts wide. Under this
# strategy a verdict reflects how ready the entry is to enter the inventory, NOT
# whether a given actor can apply — actor/access/tier are row attributes, not
# grounds to sideline. So entries that fit a non-municipal actor (firms,
# households, multilateral) are kept as promote/investigate with the actor tagged,
# rather than deprioritized. Deprioritize/reject is reserved for genuine non-fit
# (not Chile-relevant, not a funding instrument, or unverifiable).
#
# Tier: v1 = national CL public instruments. regional/multilateral entries are
# kept but tier-tagged so adding those levels later does not restructure this file.
# Freshness note: Chilean concursable funds are annual-cycle. A program being
# "closed" for its current cycle is NOT a reject — record the cycle observed and
# the recurrence, which is exactly the live-status detail the SSG 2023 set lacked.

candidates:

# ---- Backbone discovery source (harvest, not a single program) ----

- id: cl-fondos-gob-portal
  name: Portal Único de Fondos Concursables (fondos.gob.cl)
  publisher: Ministerio Secretaría General de Gobierno (SEGEGOB / MSGG)
  url: https://www.fondos.gob.cl/
  also:
    - https://fondos.gob.cl/terminoscondiciones/   # restrictive ToU
  themes: [climate_finance, aggregator, registry]
  coverage: national; aggregates 70+ competitive funds from across government
    with per-program ficha pages (fondos.gob.cl/ficha/<institution>/<slug>/).
    LIVE NOTICEBOARD ONLY — lists current-cycle funds (Abierto/Cerrado/Por abrir),
    not a historical archive. Live category counts (2026-06-08) — Medio Ambiente 49,
    Energías renovables 1, Ciudad/vivienda/infraestructura 2.
  access: public web portal; NO public API or datos.gob.cl feed found; fichas are
    HTML, partly JS-rendered. Only retrieval path is scraping — which the ToU forbids.
  license: RESTRICTIVE — NOT open data (verified, ToU read 2026-06-08); grants only
    temporary personal NON-COMMERCIAL transient viewing; prohibits copy, modify,
    commercial use, ANY public display, transfer, and "mirroring on any other
    server"; requires destroying downloads. §5 disclaims accuracy/completeness/currency.
  tier: national
  role: discovery-index-only
  screening:
    verdict: reject
    notes: >
      REJECT as a cataloged/scraped data SOURCE (date 2026-06-08): the SEGEGOB
      Terms & Conditions explicitly forbid copying, modifying, redistribution,
      public display, and mirroring — incompatible with ingesting/storing the data
      or putting it in a CityCatalyst product. Supersedes my earlier "harvest the
      fichas" note, which did not survive contact with the ToU.
      RETAINED VALUE: excellent HUMAN discovery index to find what is live and to
      navigate to each administering institution. Reopens only if SEGEGOB grants
      data-use permission or publishes an open feed.
      PIVOT (Amanda 2026-06-08): source & cite each opportunity from its
      administering institution's own official page (which carries its own, usually
      less restrictive, public terms). See cl-fondos-mma-portal below as the first
      institution-level source to review.
  added: 2026-06-08

- id: cl-fondos-mma-portal
