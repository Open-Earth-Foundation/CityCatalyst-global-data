- id: br-carteira-investimento
  name: Base de dados da Carteira de Investimento do Ministério das Cidades
  publisher: Ministério das Cidades
  url: https://dados.gov.br/dados/conjuntos-dados/base-de-dados-da-carteira-de-investimento-do-ministerio-das-cidades
  also:
  - https://dadosabertos.cidades.gov.br/dataset/base-de-dados-da-carteira-de-investimento-do-ministerio-das-cidades
  themes:
  - climate_finance
  - projects
  - federal_transfers
  coverage: National investment portfolio consolidating Transferegov, BD Gestores, Canal FGTS, Minha Casa Minha Vida and BNDES instruments; about 160,212 rows.
  access: Canonical CSV/XLSX download returns 403. Row-level access through the ministry public Power BI model is verified but a full extraction did not complete (first state partition exceeded 13 minutes).
  license: ODbL (verified in the national catalogue record).
  screening:
    verdict: investigate
    notes: canonical CSV/XLSX blocked by publisher 403; public Power BI model/table/schema and 160,212-row count verified, but the first state partition exceeded 13 minutes and no unreconciled partial output was committed; restartable builder retained. Reopen when the canonical file is retrievable or a complete Power BI extraction is feasible. A restartable Power BI builder was written and is kept locally.
  added: '2026-09-25'
