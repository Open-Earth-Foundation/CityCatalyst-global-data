- id: cl-city-action-fundability
  name: OEF — Chile city-action fundability (inventory + coverage + model)
  dataset_url: null
  publisher:
    id: oef
    name: OpenEarth Foundation (OEF)
    url: https://www.openearth.org/
  description: >
    The consolidated OEF product for how a Chilean comuna can pay for a climate action (supersedes the former cl-finance-inventory and cl-action-fundability). It unions the ten vetted Chile climate-finance supply reviews into one inventory of 99 verified funding channels, builds an action financing-availability (coverage) indicator on it, and combines four layers (action catalog, SINIM/Censo municipal capacity, the finance inventory, the projects pipeline) into a per (action x comuna) route/effort bucket plus a 0-1 financial_feasibility score with named candidate funds. A coverage and categorisation product, not a funding probability. The v1 model is implemented in production as modelled tables, a read-time score function and the climate-finance API, loaded by cc-mage pipelines; the release entries here stay production_approved false because the release artefacts themselves have not been through the definition-of-done checklist. Release v2 refreshes the inventory to 100 opportunities and derives action matching from the route rather than a sector join: 180 of its 200 links are computed from what each fund buys, how targeted it is and whether a municipality can receive it, leaving 21 hand-judged rows. Coverage, city eligibility and current availability are three separate gates; all 100 opportunities currently fail the availability gate, so v2 ships zero displayable links by design.
