- id: cl-ocha-ab
  name: Chile Administrative Boundaries (COD-AB)
  dataset_url: https://data.humdata.org/dataset/cod-ab-chl
  publisher:
    id: ocha-rolac
    name: OCHA Regional Office for Latin America and the Caribbean (ROLAC)
    url: https://data.humdata.org/dataset/cod-ab-chl
  description: >
    Official Common Operational Dataset for Administrative Boundaries (COD-AB)
    for Chile, maintained by OCHA. Provides admin1 (16 regions), admin2
    (56 provinces), and admin3 (345 comunas) boundary polygons with
    P-codes for humanitarian and analytical use.
  coverage:
    geography: country
    countries: [CL]
    spatial_levels: [admin1, admin2, admin3]
    geographic_extent:
      lon: [-109.45, -66.42]
      lat: [-55.98, -17.50]
  themes:
    - boundaries
    - administrative
    - geocoding
  update_frequency: annual_review
  priority: high
  releases:
