# Collections group datasets for discovery by country or theme.
# All dataset ids must exist in dataset-review/catalog/index.yaml.

collections:

  - id: chile
    name: Chile datasets
    datasets:
      - id: cl-ine-censo
      - id: cl-casen
      - id: cl-ocha-ab
      - id: cl-ssg-policy-documents

  - id: global-reference
    name: Global reference datasets
    datasets:
      - id: uncece-unlocode

  - id: projects
    name: Projects datasets
    datasets:
      - id: world-bank-projects
      - id: idb-projects
      - id: gcf-projects

  - id: brazil
    name: Brazil datasets
    datasets:
      - id: br-adaptabrasil

  - id: chile-finance
    name: Chile climate-finance opportunities
    # Per-source reviews of Chilean climate-relevant funding (need 2026-06-cl-finance-opportunities).
    # Harmonized into one inventory at reviews/oef/cl-finance-inventory (exploratory).
    datasets:
      - id: cl-mma-fondos
      - id: cl-minenergia-fondos
      - id: cl-subdere-fondos
      - id: cl-minvu-fondos
      - id: cl-gore-fndr
      - id: cl-corfo-finance
